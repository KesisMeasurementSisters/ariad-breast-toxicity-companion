    heading: When to contact your cancer team about paclitaxel protein-bound
    introduction: Follow the instructions given by your own cancer team.
    contact_team:
    - Contact your cancer team right away for fever, signs of infection, unusual bleeding, or new numbness, tingling, or weakness.
    - Tell the nurse immediately if breathing, swelling, dizziness, or chest symptoms start during an infusion.
    urgent_help:
    - Get urgent help for severe trouble breathing, swelling of the face or throat, fainting, chest pain, or another medical emergency.
