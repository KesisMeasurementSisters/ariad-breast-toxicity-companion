escalation_summary:
  heading: When to contact your cancer team
  introduction: Follow the instructions given by your own cancer team.
  contact_team:
    - Contact your cancer team right away for fever, chills, cough, pain or burning when you urinate, or another sign of infection.
    - Contact them right away for unusual bruising or bleeding, black stools, or blood in your urine.
    - Contact them right away if nausea or vomiting is severe, does not stop, or keeps you from drinking.
    - Tell them about new tingling, numbness, burning, or a pins-and-needles feeling in your hands or feet.
    - Contact them right away for rash, hives, itching, swelling of the lips or tongue, a sudden cough, dizziness, faintness, sweating, or chest pain.
  urgent_help:
    - Get emergency medical help right away for trouble breathing or a feeling that your throat is closing.
