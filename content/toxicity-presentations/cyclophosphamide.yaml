effects:
  - id: low-white-blood-cells
    display_name: Low infection-fighting white blood cells
    evidence_event_ids: [neutropenia]
    frequency_source_event_id: null
    frequency_band: null
    presentation_group: common
    meaning: Cyclophosphamide can lower white blood cells that help fight infection.
    what_you_may_notice:
      - You may not feel a low blood-cell count yourself.
    safe_actions:
      - Keep the blood-test appointments arranged by your cancer team.
      - Follow your cancer team's instructions for checking your temperature.
    contact_team: []
    urgent_help: []
    reassuring_monitoring:
      - Your cancer team will check your blood cells during treatment.

  - id: hair-loss
    display_name: Hair loss
    evidence_event_ids: [alopecia]
    frequency_source_event_id: null
    frequency_band: null
    presentation_group: common
    meaning: Your hair may become thinner or fall out during treatment.
    what_you_may_notice:
      - Hair thinning or hair loss
    safe_actions: []
    contact_team:
      - Ask your cancer team if you would like support with hair changes.
    urgent_help: []
    reassuring_monitoring: []

  - id: nausea-or-vomiting
    display_name: Nausea or vomiting
    evidence_event_ids: [nausea, vomiting]
    frequency_source_event_id: null
    frequency_band: null
    presentation_group: common
    meaning: You may feel sick to your stomach or throw up.
    what_you_may_notice:
      - A feeling that you may vomit
      - Throwing up during the treatment period
    safe_actions:
      - Follow the nausea plan provided by your cancer team.
    contact_team:
      - Contact your cancer team right away if vomiting does not stop or keeps you from drinking.
    urgent_help: []
    reassuring_monitoring: []

  - id: diarrhea
    display_name: Diarrhea
    evidence_event_ids: [diarrhea]
    frequency_source_event_id: null
    frequency_band: null
    presentation_group: common
    meaning: Your bowel movements may become loose or watery.
    what_you_may_notice:
      - Loose or watery bowel movements
    safe_actions:
      - Follow the diarrhea instructions given by your cancer team.
    contact_team:
      - Contact your cancer team right away if diarrhea is severe, does not stop, or makes it hard to drink.
    urgent_help: []
    reassuring_monitoring: []

  - id: fever-or-serious-infection
    display_name: Fever or serious infection
    evidence_event_ids: [febrile-neutropenia, fever, myelosuppression-and-infections]
    frequency_source_event_id: null
    frequency_band: null
    presentation_group: serious
    meaning: Low blood cells can allow an infection to become serious very quickly.
    what_you_may_notice:
      - Fever, chills, cough, or feeling suddenly unwell
      - Pain or burning when you urinate
    safe_actions:
      - Follow your cancer team's instructions for checking your temperature.
    contact_team:
      - Contact your cancer team immediately for a fever or another sign of infection.
    urgent_help: []
    reassuring_monitoring:
      - Your cancer team will check your blood cells during treatment.

  - id: bladder-or-urinary-tract-damage
    display_name: Bladder or urinary tract damage
    evidence_event_ids: [urinary-tract-and-renal-toxicity]
    frequency_source_event_id: null
    frequency_band: null
    presentation_group: serious
    meaning: Cyclophosphamide can irritate or damage the bladder, urinary tract, or kidneys.
    what_you_may_notice:
      - Pink or red urine
      - Pain, burning, or another new problem when you urinate
    safe_actions:
      - Follow your cancer team's instructions about fluids and emptying your bladder around treatment.
    contact_team:
      - Contact your cancer team right away for pink or red urine or another new urinary symptom.
    urgent_help: []
    reassuring_monitoring:
      - Your cancer team may check your urine and kidney function during treatment.

  - id: heart-problems
    display_name: Heart problems
    evidence_event_ids: [cardiotoxicity]
    frequency_source_event_id: null
    frequency_band: null
    presentation_group: serious
    meaning: Cyclophosphamide can sometimes damage the heart.
    what_you_may_notice:
      - New or worsening shortness of breath or cough
      - Swelling in the ankles or legs, a racing or irregular heartbeat, sudden weight gain, dizziness, or fainting
    safe_actions: []
    contact_team:
      - Contact a health professional immediately for any of these changes.
    urgent_help:
      - Get emergency help for severe chest pain, severe trouble breathing, or loss of consciousness.
    reassuring_monitoring:
      - Your care team may monitor your heart if you have heart problems or other risk factors.

  - id: lung-problems
    display_name: Lung problems
    evidence_event_ids: [pulmonary-toxicity]
    frequency_source_event_id: null
    frequency_band: null
    presentation_group: serious
    meaning: Cyclophosphamide can sometimes inflame or scar the lungs.
    what_you_may_notice:
      - A new or worsening cough or shortness of breath
    safe_actions: []
    contact_team:
      - Contact your cancer team promptly for a new or worsening cough or shortness of breath.
    urgent_help:
      - Get emergency help if you are struggling to breathe.
    reassuring_monitoring: []

  - id: severe-allergic-reaction
    display_name: Severe allergic reaction
    evidence_event_ids: [hypersensitivity]
    frequency_source_event_id: null
    frequency_band: null
    presentation_group: serious
    meaning: A severe allergic reaction can happen during or after treatment.
    what_you_may_notice:
      - Swelling of the face, lips, tongue, or throat
      - Hives, trouble breathing, severe dizziness, or fainting
    safe_actions: []
    contact_team: []
    urgent_help:
      - Get emergency medical help right away for trouble breathing, throat swelling, severe dizziness, or fainting.
    reassuring_monitoring: []

  - id: another-cancer-later
    display_name: Another cancer later
    evidence_event_ids: [secondary-malignancies]
    frequency_source_event_id: null
    frequency_band: null
    presentation_group: serious
    meaning: Cyclophosphamide can increase the long-term risk of developing another cancer.
    what_you_may_notice:
      - There may be no early symptom you can feel.
    safe_actions:
      - Keep the long-term follow-up appointments recommended by your cancer team.
    contact_team:
      - Ask your cancer team if you have questions about this long-term risk.
    urgent_help: []
    reassuring_monitoring: []

  - id: pregnancy-or-fertility-harm
    display_name: Pregnancy or fertility harm
    evidence_event_ids: [embryo-fetal-toxicity, infertility]
    frequency_source_event_id: null
    frequency_band: null
    presentation_group: serious
    meaning: Cyclophosphamide can harm a pregnancy and may affect the ability to have children.
    what_you_may_notice:
      - Fertility changes may not cause a symptom you can feel.
    safe_actions:
      - Follow your cancer team's pregnancy-prevention and breastfeeding instructions.
    contact_team:
      - Tell your cancer team immediately if you are pregnant or think you may be pregnant.
      - Ask your cancer team about fertility before or during treatment if this matters to you.
    urgent_help: []
    reassuring_monitoring: []

