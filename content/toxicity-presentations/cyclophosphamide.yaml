escalation_summary:
  heading: When to contact your cancer team
  introduction: Follow the instructions given by your own cancer team.
  contact_team:
    - Contact your cancer team immediately for a fever, chills, cough, burning when you urinate, or another sign of infection.
    - Contact them right away for pink or red urine or another new urinary symptom.
    - Contact a health professional immediately for new or worsening shortness of breath, cough, leg swelling, a racing or irregular heartbeat, sudden weight gain, dizziness, or fainting.
    - Contact your cancer team right away if vomiting or diarrhea does not stop or keeps you from drinking.
    - Tell your cancer team immediately if you are pregnant or think you may be pregnant.
  urgent_help:
    - Get emergency medical help right away for severe chest pain, severe trouble breathing, swelling of the face, lips, tongue, or throat, severe dizziness, or loss of consciousness.
