effects:
  - id: low-blood-cells
    display_name: Low blood cells
    evidence_event_ids: [leukopenia, neutropenia, anemia, thrombocytopenia]
    frequency_source_event_id: null
    frequency_band: null
    presentation_group: common
    meaning: Epirubicin can lower blood cells that fight infection, carry oxygen, or help stop bleeding.
    what_you_may_notice:
      - You may not notice this change yourself.
    safe_actions:
      - Keep the blood-test appointments arranged by your cancer team.
      - Follow your cancer team's instructions for checking your temperature.
    contact_team: []
    urgent_help: []
    reassuring_monitoring:
      - Your cancer team will check your blood cells during treatment.

