escalation_summary:
  heading: When to contact your cancer team
  introduction: Follow the instructions given by your own cancer team.
  contact_team:
    - Contact your cancer team right away for a fever or another sign of infection.
    - Contact a health professional right away for new chest pain, shortness of breath, dizziness, or feeling lightheaded.
    - Tell your nurse right away about burning or stinging while the medicine is being given. Contact your cancer team right away for pain where the IV entered your skin after treatment.
    - Contact your cancer team right away if nausea, vomiting, diarrhea, or mouth sores are severe or keep you from eating or drinking.
    - Contact your cancer team for eye pain, vision changes, or a severe or spreading rash.
  urgent_help:
    - Get emergency medical help right away for severe chest pain, severe trouble breathing, passing out, or being hard to wake.
