escalation_summary:
  heading: When to contact your cancer team
  introduction: >-
    Immune-system problems can happen during treatment or after it has ended.
    Follow the instructions given by your own cancer team.
  contact_team:
    - Contact your cancer team right away for a new or worsening cough, shortness of breath, chest pain, diarrhea, severe stomach pain, black or bloody stools, yellow skin or eyes, dark urine, or a severe skin reaction.
    - Contact them right away for unusual headaches, extreme tiredness, dizziness, major thirst or urine changes, ankle swelling, confusion, vision changes, severe weakness, or another new or worsening symptom.
    - Contact your cancer team immediately for a fever.
    - Tell your nurse immediately about chills, shaking, rash, breathing problems, dizziness, or faintness during the infusion.
    - Tell your cancer team immediately if you are pregnant or think you may be pregnant.
  urgent_help:
    - Get emergency medical help right away for severe chest pain, severe trouble breathing, fainting, or loss of consciousness.
