escalation_summary:
  heading: When to contact your cancer team
  introduction: Follow the instructions given by your own cancer team.
  contact_team:
    - Contact your cancer team right away for fever.
    - Contact them right away for new or worsening stomach pain, soreness, or diarrhea, with or without fever.
    - Contact them right away for swelling in the legs or feet, weight gain, or shortness of breath.
    - Contact them right away for numbness, tingling, burning, weakness in an arm or leg, or any vision change.
    - Contact them right away for blistering, peeling, bleeding, or widespread severe skin changes.
  urgent_help:
    - Get urgent help for trouble breathing or swallowing, sudden swelling of the face, lips, tongue, or throat, or widespread hives or redness.
    - While the medicine is being given, tell the nurse right away about a fast or uneven heartbeat, severe shortness of breath, dizziness, or fainting. If this happens after the medicine was given, get medical help right away.
