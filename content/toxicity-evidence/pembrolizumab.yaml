notes:
  - The fourteen most-common reactions are explicitly labelled for KEYTRUDA as a single agent, but they are not a breast-specific frequency table.
  - KEYNOTE-522 rates combine neoadjuvant pembrolizumab plus chemotherapy with adjuvant pembrolizumab and are not attributed to pembrolizumab alone.
  - The pooled 2,799-patient warning rates are retained as source context and are not transformed into patient frequency bands in this record.
  - Warning status is stored separately from frequency; serious does not mean common.
  - This record maps the FDA single-agent common list and principal patient-relevant warnings; it is not an exhaustive transcription of the label.
