notes:
  - Table 1 rates come from FEC and CEF combination regimens and are not attributed to epirubicin alone.
  - Most-common is preserved as an FDA categorical claim and is not converted into Ariad's numerical frequency bands.
  - Warning status is stored separately from frequency; serious does not mean common.
  - This record maps the fourteen FDA-defined most-common categories and four boxed warnings; it is not an exhaustive transcription of the label.
  - The label safety evidence is not asserted to come from a single-agent treatment population.
