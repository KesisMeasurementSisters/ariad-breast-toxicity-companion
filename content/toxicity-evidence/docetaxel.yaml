notes:
  - >-
    Table 3 adverse reactions were described using COSTART terms and considered
    possibly or probably related to docetaxel.
  - >-
    This is the largest breast-cancer population with a complete monotherapy
    frequency column in the selected FDA label.
  - >-
    The population includes both previously treated and untreated patients and
    must not be described as an indication-matched post-chemotherapy cohort.
  - Exact percentages are evidence data and are not patient-display copy.
