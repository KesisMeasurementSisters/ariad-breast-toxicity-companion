- <<: *module_base
  id: ac-fever-infection-context
  section: treatment_context
  title: Why it matters with this treatment
  paragraphs:
    - 'AC has two medicines: doxorubicin and cyclophosphamide. Chemotherapy can lower white blood cells. These cells fight infection. An infection can then become serious.'
  applicability: { treatment_ids: [ac], symptom_ids: [fever-infection-concern] }
  priority_tags: [infection-observations]
  source_ids: [cco-ac-breast-patient-information, eviq-dose-dense-ac-breast-patient-information]
  claim_ids: [claim-ac-components, claim-chemotherapy-infection-risk]

- <<: *module_base
  id: infection-home-preparation
  section: home_management
  title: General steps you can take at home
  paragraphs:
    - Follow the infection and fever instructions from your cancer team.
  bullets:
    - Keep a working digital thermometer available.
    - If you feel hot, chilled, or unwell, take your temperature before using medicine that lowers fever. This medicine can hide a fever.
    - Avoid hot or cold food and drink just before taking your temperature by mouth.
    - Wash your hands often. Keep cuts and the skin around any treatment line (a tube used to give medicine) clean.
  applicability: { treatment_ids: [ac], symptom_ids: [fever-infection-concern] }
  priority_tags: [infection-observations]
  source_ids: [cco-fever-patient-guide, eviq-infection-during-cancer-treatment]
  claim_ids: [claim-thermometer-readiness, claim-fever-medicine-masking, claim-infection-precautions]

- <<: *module_base
  id: infection-contact-team
  section: contact_team
  title: Contact your cancer team if…
  paragraphs: []
  bullets:
    - You have chills, shaking, sweats, a sore throat, or a cough.
    - You have burning or blood when passing urine, mouth sores, or red or sore skin around a wound or treatment line.
    - You have vomiting or diarrhea that does not stop.
    - You feel unwell even without a measured fever.
  applicability: { treatment_ids: [ac], symptom_ids: [fever-infection-concern] }
  priority_tags: [infection-observations, contact-information]
  source_ids: [cco-ac-breast-patient-information, eviq-infection-during-cancer-treatment]
  claim_ids: [claim-infection-contact-observations]

- <<: *module_base
  id: infection-urgent-attention
  section: urgent_attention
  title: Get urgent medical help if…
  paragraphs:
    - Ariad does not yet show what temperature your clinic uses for a fever. Follow the fever instructions from your cancer team.
  bullets:
    - You cannot reach your cancer team and suddenly feel very unwell.
    - You are short of breath, feel faint or very dizzy, or have a fast heartbeat.
    - You think you need emergency medical help.
  applicability: { treatment_ids: [ac], symptom_ids: [fever-infection-concern] }
