- <<: *module_base
  id: infection-reporting-checklist
  section: reporting_checklist
  title: What information to have ready
  paragraphs: []
  bullets:
    - Your highest temperature, how you took it, and the times you took it.
    - Any chills, shaking, sweats, cough, sore throat, or breathing problems. Also note changes when you pass urine or have a bowel movement. Include mouth or skin changes and changes around a wound or treatment line.
    - When you last had AC treatment.
    - Whether you took medicine to lower a fever, and when.
  applicability: { treatment_ids: [ac], symptom_ids: [fever-infection-concern] }
