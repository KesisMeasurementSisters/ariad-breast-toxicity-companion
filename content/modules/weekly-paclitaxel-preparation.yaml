- <<: *module_base
  id: weekly-paclitaxel-prep-possible-effects
  title: Side effects to know about
  paragraphs:
    - Several side effects can happen during treatment with paclitaxel. Each person is different. Ariad cannot tell which side effects you may have.
  bullets:
    - Tiredness, nausea, and hair loss can occur.
    - Blood cell counts may fall. You may also need to watch for infection.
    - Tingling, numbness, burning, or pain in the hands or feet can occur.
  source_ids: [eviq-weekly-paclitaxel-breast-patient-information, cco-paclitaxel-patient-information]
  claim_ids: [claim-paclitaxel-possible-effects]

- <<: *module_base
  id: weekly-paclitaxel-prep-practical
  title: A simple preparation checklist
  paragraphs: []
  bullets:
    - Save your cancer team's daytime and after-hours contact information.
    - Keep a working digital thermometer available and follow your team's fever instructions.
    - Bring a current list of your medicines. Follow only the medicine instructions from your team.
    - Know how to reach the place where you get treatment if you have questions before a visit.
  source_ids: [eviq-weekly-paclitaxel-breast-patient-information, cco-fever-patient-guide]
  claim_ids: [claim-treatment-preparation-checklist]

