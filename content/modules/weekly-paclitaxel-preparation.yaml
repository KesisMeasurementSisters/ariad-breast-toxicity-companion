- <<: *module_base
  id: weekly-paclitaxel-prep-possible-effects
  title: Effects to know about
  paragraphs:
    - Paclitaxel can be associated with several effects. Your experience may differ, and this prototype cannot predict which effects you will have.
  bullets:
    - Tiredness, nausea, and hair loss can occur.
    - Lowered blood counts and infection concerns can occur.
    - Tingling, numbness, burning, or pain in the hands or feet can occur.
  source_ids: [eviq-weekly-paclitaxel-breast-patient-information, cco-paclitaxel-patient-information]
  claim_ids: [claim-paclitaxel-possible-effects]

- <<: *module_base
  id: weekly-paclitaxel-prep-practical
  title: A simple preparation checklist
  paragraphs: []
  bullets:
    - Save your cancer team's daytime and after-hours contact information.
    - Keep a working digital thermometer available and follow your team's fever instructions.
    - Bring an up-to-date medication list and follow only the medicine instructions your team provided.
    - Know how to reach your treatment area if you have questions before a visit.
  source_ids: [eviq-weekly-paclitaxel-breast-patient-information, cco-fever-patient-guide]
  claim_ids: [claim-treatment-preparation-checklist]

- <<: *module_base
  id: weekly-paclitaxel-prep-warning-boundary
  title: Warning information is fixed, not personalized
  paragraphs:
    - Ariad can show source-controlled warning information, but it cannot decide whether a symptom is caused by treatment or tell you what action you personally need.
    - Follow the instructions provided by your cancer team. If you think you may be experiencing a medical emergency, call 911 or your local emergency service.
