  id: neuropathy-urgent-neurological-signs
  section: urgent_attention
  title: Get urgent medical help if…
  paragraphs:
    - These are general signs of a brain or nerve emergency. They do not tell you if you have peripheral neuropathy or how serious it is.
  bullets:
    - You develop sudden confusion or trouble speaking.
    - You have sudden difficulty moving an arm or leg.
    - You have a seizure or pass out.
