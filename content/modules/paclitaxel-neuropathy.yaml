  section: about
  title: About this symptom
  paragraphs:
    - Peripheral neuropathy can feel like tingling, pins and needles, numbness, burning, or pain, often in the fingers or toes. It can also affect grip, balance, or movement.
    - Other conditions can cause similar symptoms. Ariad cannot determine the cause.
