  section: urgent_attention
  title: Seek urgent medical attention if…
  paragraphs:
    - These are general neurological emergency signs. They do not identify or grade peripheral neuropathy.
  bullets:
    - You develop sudden confusion or trouble speaking.
    - You have sudden difficulty moving an arm or leg.
    - You have a seizure or pass out.
