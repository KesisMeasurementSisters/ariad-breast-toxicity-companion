  section: about
  title: About this symptom
  paragraphs:
    - A nerve problem called peripheral neuropathy can feel like tingling, pins and needles, numbness, burning, or pain. It often affects the fingers or toes. It can also affect your grip, balance, or movement.
    - Other health problems can cause the same symptoms. Ariad cannot tell what is causing them.
