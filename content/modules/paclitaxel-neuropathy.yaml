- <<: *module_base
  id: neuropathy-home-safety
  section: home_management
  title: What you can generally do at home
  paragraphs:
    - These are general precautions. Follow the instructions provided by your cancer team.
  bullets:
    - Protect areas with reduced feeling and check your hands and feet for cuts.
    - Use supportive shoes and protective gloves for household or outdoor tasks.
    - Test bath water with your elbow before putting numb hands or feet into it.
    - Keep floors and walkways well lit and clear of clutter.
    - Ask your team about driving if sensation or foot control is affected.
  applicability: { treatment_ids: [weekly-paclitaxel, paclitaxel], symptom_ids: [peripheral-neuropathy] }
  priority_tags: [hand-safety, foot-safety, fall-prevention]
  source_ids: [eviq-weekly-paclitaxel-breast-patient-information, bc-cancer-peripheral-neuropathy-handout]
  claim_ids: [claim-neuropathy-injury-prevention, claim-neuropathy-fall-prevention]

