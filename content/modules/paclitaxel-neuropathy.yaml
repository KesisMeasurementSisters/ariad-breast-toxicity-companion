  id: paclitaxel-neuropathy-context
  section: treatment_context
  title: Why it matters with this treatment
  paragraphs:
    - Peripheral neuropathy can occur with paclitaxel. Symptoms may affect tasks such as fastening buttons, writing, or picking up small objects.
  applicability: { treatment_ids: [weekly-paclitaxel, paclitaxel], symptom_ids: [peripheral-neuropathy] }
