  id: capecitabine-diarrhea-context
  section: treatment_context
  title: Why it matters with this treatment
  paragraphs:
    - Diarrhea can occur with capecitabine. Ongoing diarrhea can cause loss of fluid and body salts.
  applicability: { treatment_ids: [capecitabine-monotherapy, capecitabine], symptom_ids: [diarrhea] }
