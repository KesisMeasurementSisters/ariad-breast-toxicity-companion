- <<: *module_base
  id: diarrhea-reporting-checklist
  section: reporting_checklist
  title: What information to have ready
  paragraphs: []
  bullets:
    - When the diarrhea began and the number of loose or watery bowel movements in 24 hours.
    - How that compares with your usual bowel movements, including whether it happened at night.
    - Any blood, mucus, vomiting, dizziness, belly pain, or temperature reading.
    - How much you have been able to drink and any change in how often you pass urine.
    - Any medicine for diarrhea used as your team instructed, and your last dose of capecitabine.
  applicability: { treatment_ids: [capecitabine-monotherapy, capecitabine], symptom_ids: [diarrhea] }
  priority_tags: [tracking]
  source_ids: [cco-capecitabine-patient-information, cco-manage-diarrhea]
