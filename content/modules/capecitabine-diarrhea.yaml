- <<: *module_base
  id: diarrhea-home-management
  section: home_management
  title: What you can generally do at home
  paragraphs:
    - These are general measures. Follow any fluid, diet, or medicine instructions provided by your cancer team.
  bullets:
    - Keep a record of bowel movements.
    - Unless your team has limited your fluids, sip fluids regularly.
    - Choose small meals and limit caffeine, alcohol, spicy foods, and high-fat foods.
    - Use anti-diarrheal medicine only as your cancer team instructed.
    - Keep the skin around the anus clean and dry, and use gentle care after bowel movements.
  applicability: { treatment_ids: [capecitabine-monotherapy, capecitabine], symptom_ids: [diarrhea] }
  priority_tags: [tracking, hydration, team-instructions]
  source_ids: [cco-capecitabine-patient-information, cco-manage-diarrhea]
  claim_ids: [claim-diarrhea-tracking, claim-diarrhea-hydration, claim-diarrhea-foods, claim-diarrhea-team-directed-medicine]

- <<: *module_base
  id: diarrhea-contact-team
  section: contact_team
  title: Contact your cancer team if…
  paragraphs: []
  bullets:
    - There are more than seven loose or watery bowel movements in 24 hours.
    - Diarrhea continues for more than 24 hours after medicine used according to your team's instructions.
    - You cannot drink enough, there is blood, or you have belly pain other than your usual cramping.
    - You notice thirst, dry mouth, dark or reduced urine, dizziness, vomiting, or a fast heartbeat.
  applicability: { treatment_ids: [capecitabine-monotherapy, capecitabine], symptom_ids: [diarrhea] }
  priority_tags: [contact-information, hydration]
  source_ids: [cco-capecitabine-patient-information, cco-manage-diarrhea]
  claim_ids: [claim-diarrhea-contact-observations]

