  section: about
  title: About this symptom
  paragraphs:
    - Diarrhea means loose, watery, or not fully formed bowel movements. It can also mean going more often than is usual for you. You may have a sudden need to go, bloating, or cramps.
    - Other health problems can cause the same symptoms. Ariad cannot tell what is causing them.
