- <<: *chest
  id: chest-symptoms-home-management
  section: home_management
  title: What to do while getting help
  paragraphs:
    - New chest pain or pressure can be an emergency. Do not try to decide the cause yourself.
  bullets:
    - Stop what you are doing. Sit or lie in the position that feels safest.
    - Call 911 for the emergency signs below. Do not drive yourself.
    - Use only emergency medicine already prescribed to you, and only as instructed.
    - Keep your medicine list ready for emergency workers.
  priority_tags: [emergency-preparation]
  claim_ids: [claim-chest-symptoms-immediate-steps]

- <<: *chest
  id: chest-symptoms-contact-team
  section: contact_team
  title: Contact your cancer team if…
  paragraphs:
    - Tell your cancer team about any new chest symptom, even if it stops. Do not wait for a reply before calling 911 for the signs below.
  bullets:
    - Note when it started, what it felt like, how long it lasted, and what you were doing.
    - Tell them about cough, feverish feelings, swelling, a fast heartbeat, or breathing changes.
  priority_tags: [contact-information, tracking, chest-change, breathing-change]
  claim_ids: [claim-chest-symptoms-contact-signs]

- <<: *chest
  id: chest-symptoms-urgent-attention
  section: urgent_attention
  title: Call 911 if…
  paragraphs:
    - Call 911 now. Do not drive yourself.
  bullets:
    - You have chest pressure, squeezing, fullness, pain, burning, or heaviness.
    - Chest discomfort happens with sweating, nausea, shortness of breath, light-headedness, or discomfort in your neck, jaw, shoulder, arms, or back.
    - You collapse, cannot be woken, or are not breathing normally.
  priority_tags: [chest-change, breathing-change]
  source_ids: [heart-stroke-emergency-signs]
  claim_ids: [claim-chest-symptoms-emergency-signs]

