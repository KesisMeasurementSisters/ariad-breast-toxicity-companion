  section: home_management
  title: General steps you can take at home
  paragraphs:
    - Use pain medicine only as your cancer team told you.
  bullets:
    - Balance rest with gentle movement. Stop if movement makes the pain worse.
    - Support the sore area and change position often.
    - Use heat or cold only if your team says it is safe. Wrap the pack and protect your skin.
    - Record where the symptom is, when it starts, and what makes it better or worse.
  priority_tags: [tracking, daily-activities]
