- &infusion_allergic
  <<: *module_base
  id: infusion-allergic-about
  section: about
  title: About infusion and allergic symptoms
  paragraphs:
    - A reaction may include flushing, itching, hives, rash, swelling, throat tightness, cough, wheeze, trouble breathing, chest tightness, nausea, diarrhea, dizziness, or fainting.
    - A reaction can have more than one cause. Ariad cannot tell whether it is an allergy or what is causing it.
  applicability: { treatment_ids: [systemic-therapy], symptom_ids: [infusion-allergic-symptoms] }
  source_ids: [eviq-hypersensitivity-reaction, canada-anaphylaxis-signs]
  claim_ids: [claim-infusion-allergic-description-and-cause-boundary]

- <<: *infusion_allergic
  id: infusion-allergic-home-management
  section: home_management
  title: What to do if symptoms start
  paragraphs:
    - If symptoms start during an infusion, tell the nurse immediately. Do not wait for the infusion to end.
  bullets:
    - If symptoms start after you leave, stop what you are doing and keep your phone nearby.
    - Do not drive yourself if you have breathing trouble, throat or face swelling, chest tightness, fainting, or severe dizziness.
    - Do not take a new allergy medicine unless a health professional tells you to.
    - Note when symptoms started and when the infusion was given.
  priority_tags: [emergency-preparation, tracking]
  claim_ids: [claim-infusion-allergic-immediate-steps]

- <<: *infusion_allergic
  id: infusion-allergic-contact-team
  section: contact_team
  title: Contact your cancer team right away if…
  paragraphs: []
  bullets:
    - You notice new flushing, itching, hives, rash, swelling, cough, wheeze, nausea, vomiting, or diarrhea during or soon after an infusion.
    - Symptoms improve but then return.
    - Do not wait for a reply before calling 911 for the emergency signs below.
  priority_tags: [contact-information, allergy-signs, breathing-change, fall, stomach-change]
  claim_ids: [claim-infusion-allergic-contact-signs]

- <<: *infusion_allergic
  id: infusion-allergic-urgent-attention
  section: urgent_attention
  title: Call 911 if…
  paragraphs:
    - A severe allergic reaction is an emergency. Call 911 now.
  bullets:
    - Your face, lips, tongue, or throat swells, or your throat feels tight.
    - You have trouble breathing, wheeze, chest tightness, or cannot speak normally.
    - You faint, collapse, become confused, or feel suddenly very dizzy.
  priority_tags: [allergy-signs, breathing-change, fall]
  source_ids: [eviq-hypersensitivity-reaction, canada-anaphylaxis-signs]
  claim_ids: [claim-infusion-allergic-emergency-signs]
