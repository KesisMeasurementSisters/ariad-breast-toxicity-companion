- &fatigue
  <<: *module_base
  id: fatigue-about
  section: about
  title: About fatigue
  paragraphs:
    - Fatigue is tiredness or low energy that may not improve with rest.
    - Cancer, treatment, sleep, pain, stress, or another health problem may be involved. Ariad cannot tell what is causing it.
  applicability: { treatment_ids: [systemic-therapy], symptom_ids: [fatigue] }
  source_ids: [cco-fatigue-patient-guide]
  claim_ids: [claim-fatigue-description-and-cause-boundary]

- <<: *fatigue
  id: fatigue-home-management
  section: home_management
  title: General steps you can take at home
  paragraphs:
    - Balance activity with rest. Stop before you feel worn out.
  bullets:
    - Plan the most important tasks for the time of day when you have more energy.
    - Break large tasks into smaller steps. Ask for help when you need it.
    - Try light movement, such as a short walk, if it is safe for you and your team has not told you to limit activity.
    - Keep a regular sleep routine. Eat and drink regularly unless your team gave you other instructions.
  priority_tags: [daily-activities]
  claim_ids: [claim-fatigue-home-steps]

- <<: *fatigue
  id: fatigue-contact-team
  section: contact_team
  title: Contact your cancer team if…
  paragraphs: []
  bullets:
    - The fatigue is new, suddenly worse, or keeps you from washing, dressing, eating, or moving safely.
    - You also feel dizzy, off balance, short of breath, confused, or notice a fast heartbeat.
    - Rest does not help, or fatigue keeps getting worse.
  priority_tags: [contact-information, balance, breathing-heart, thinking-change]
  claim_ids: [claim-fatigue-contact-signs]

- <<: *fatigue
  id: fatigue-urgent-attention
  section: urgent_attention
  title: Get urgent medical help if…
  paragraphs: []
  bullets:
    - You have new trouble breathing, chest pain or pressure, fainting, or sudden confusion.
    - You have sudden face drooping, arm weakness, or speech that is slurred or hard to understand. Call 911.
  priority_tags: [breathing-heart, thinking-change]
  source_ids: [cco-fatigue-patient-guide, heart-stroke-emergency-signs, canada-stroke-warning-signs]
  claim_ids: [claim-fatigue-urgent-signs]

- &nausea
  <<: *module_base
  id: nausea-about
  section: about
  title: About nausea
  paragraphs:
    - Nausea is a sick or uneasy feeling in your stomach. You may feel as if you could vomit.
    - Treatment, medicines, food, pain, worry, or another health problem may be involved. Ariad cannot tell what is causing it.
  applicability: { treatment_ids: [systemic-therapy], symptom_ids: [nausea] }
  source_ids: [cco-nausea-vomiting-patient-guide, eviq-general-chemotherapy-side-effects]
  claim_ids: [claim-nausea-description-and-cause-boundary]

- <<: *nausea
  id: nausea-home-management
  section: home_management
  title: General steps you can take at home
  paragraphs:
    - Use anti-nausea medicine only as your cancer team told you.
  bullets:
    - Eat small amounts more often. Choose plain, cool, or room-temperature foods if smells bother you.
    - Sip fluids often unless your team told you to limit them.
    - Sit upright after eating. Get fresh air and avoid strong smells when you can.
    - Keep a note of when nausea starts, what you ate, and what helped.
  priority_tags: [hydration, tracking]
  claim_ids: [claim-nausea-home-steps]

- <<: *nausea
  id: nausea-contact-team
  section: contact_team
  title: Contact your cancer team if…
  paragraphs: []
  bullets:
    - You cannot eat or drink enough.
    - You cannot take a medicine the way your team told you.
    - Your medicine for nausea does not help, or the nausea is getting worse.
    - You also vomit, have belly pain, cannot pass stool, have diarrhea, feel dizzy, or pass very little urine.
  priority_tags: [contact-information, hydration, food-fluids]
  claim_ids: [claim-nausea-contact-signs]

- <<: *nausea
  id: nausea-urgent-attention
  section: urgent_attention
  title: Get urgent medical help if…
  paragraphs: []
  bullets:
    - You faint, become confused, or cannot keep fluids down and pass very little urine.
    - You vomit blood or material that looks like coffee grounds, or have strong belly pain.
    - Nausea happens with chest pain or pressure, trouble breathing, or sudden weakness. Call 911.
  priority_tags: [food-fluids]
  source_ids: [cco-nausea-vomiting-patient-guide, heart-stroke-emergency-signs, canada-stroke-warning-signs]
  claim_ids: [claim-nausea-urgent-signs]

