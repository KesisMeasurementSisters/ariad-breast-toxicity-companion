- &dizziness
  <<: *module_base
  id: dizziness-about
  section: about
  title: About dizziness
  paragraphs:
    - Dizziness may make you feel light-headed or unsteady. The room may feel like it is spinning. You may feel as if you could faint.
    - Treatment, medicines, not enough fluid, blood changes, or another health problem may play a part. Ariad cannot tell what is causing it.
  applicability: { treatment_ids: [systemic-therapy], symptom_ids: [dizziness] }
  source_ids: [cco-fatigue-patient-guide, ccs-heart-problems]
  claim_ids: [claim-dizziness-description-and-cause-boundary]

- <<: *dizziness
  id: dizziness-home-management
  section: home_management
  title: General steps you can take at home
  paragraphs:
    - Sit or lie down when you feel dizzy. Get up slowly when you feel steady.
  bullets:
    - Hold a railing or ask someone to stay near you when walking.
    - Do not drive, use a ladder, or shower alone while you feel unsteady.
    - Sip fluids unless your team told you to limit them.
