- &constipation
  <<: *module_base
  id: constipation-about
  section: about
  title: About constipation
  paragraphs:
    - Constipation means it is hard to have a bowel movement. Your stool may be hard or dry. You may go less often than usual.
    - Treatment, medicines, food, fluids, activity, or another health problem may play a part. Ariad cannot tell what is causing it.
  applicability: { treatment_ids: [systemic-therapy], symptom_ids: [constipation] }
  source_ids: [cco-constipation-patient-guide]
  claim_ids: [claim-constipation-description-and-cause-boundary]

- <<: *constipation
  id: constipation-home-management
  section: home_management
  title: General steps you can take at home
  paragraphs:
    - Follow the bowel plan from your cancer team. Use laxatives or other bowel medicine only as instructed.
  bullets:
    - Drink fluids regularly unless your team told you to limit them.
    - Move gently each day if it is safe for you.
    - Try to use the toilet at the same time each day. Do not ignore the need to go.
    - Keep a record of bowel movements, pain, gas, food, and fluids.
    - Ask your team before adding a lot of fibre, especially if you have pain, bloating, or vomiting.
  priority_tags: [tracking, team-instructions]
  claim_ids: [claim-constipation-home-steps]

- <<: *constipation
  id: constipation-contact-team
  section: contact_team
  title: Contact your cancer team if…
  paragraphs: []
  bullets:
    - You have not had a bowel movement for more than three days.
    - You cannot pass gas, or have new bloating, cramps, belly pain, nausea, or vomiting.
    - You see red blood or a black bowel movement.
    - Your bowel plan is not helping.
  priority_tags: [contact-information, bowel-change, pain, food-fluids, bleeding]
  claim_ids: [claim-constipation-contact-signs]

- <<: *constipation
  id: constipation-urgent-attention
  section: urgent_attention
  title: Get urgent medical help if…
  paragraphs: []
  bullets:
    - You have strong or quickly worsening belly pain with vomiting, swelling, or no gas.
    - You have heavy bleeding, faint, or become confused.
    - You cannot reach your cancer team and the warning signs above are getting worse.
  priority_tags: [bowel-change, pain, food-fluids, bleeding]
  source_ids: [cco-constipation-patient-guide]
  claim_ids: [claim-constipation-urgent-signs]

