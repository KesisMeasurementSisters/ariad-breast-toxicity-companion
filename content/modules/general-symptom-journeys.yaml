  section: about
  title: About mouth soreness
  paragraphs:
    - Your mouth or throat may feel dry, sore, tender, or different. You may notice sores, white patches, bleeding, or taste changes.
    - Treatment, medicines, infection, or another health problem may be involved. Ariad cannot tell what is causing it.
  applicability: { treatment_ids: [systemic-therapy], symptom_ids: [mouth-soreness] }
