- <<: *nail_hair
  id: nail-hair-home-management
  section: home_management
  title: General steps you can take at home
  paragraphs:
    - Handle your hair, scalp, nails, and skin gently.
  bullets:
    - Use a mild shampoo, a soft brush or wide-tooth comb, and low heat.
    - Protect your scalp from sun and cold with sunscreen, a hat, or a scarf.
    - Keep nails short and clean. Do not bite nails or cut cuticles.
    - Use gloves for wet work. Apply a plain moisturizer around the nails.
    - Avoid artificial nails, strong nail products, or hair chemicals if your skin or nails are sore.
  priority_tags: [skin-care, personal-care]
  claim_ids: [claim-nail-hair-home-steps]

- <<: *nail_hair
  id: nail-hair-contact-team
  section: contact_team
  title: Contact your cancer team if…
  paragraphs: []
  bullets:
    - A nail is painful, loose, red or darker around the edge, swollen, warm, or draining.
    - Your scalp has a new rash, sores, drainage, or strong pain.
    - Hair or nail changes are upsetting or make daily care hard.
  priority_tags: [contact-information, skin-care, hair-change, nail-change, skin-change]
  claim_ids: [claim-nail-hair-contact-signs]

