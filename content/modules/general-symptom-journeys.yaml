- &blood_clot
  <<: *module_base
  id: blood-clot-warning-about
  section: about
  title: About possible blood-clot signs
  paragraphs:
    - Possible signs include new pain, redness, warmth, or swelling in one arm or leg. A clot in the lung can cause shortness of breath, chest or back pain, or coughing up blood.
    - Other health problems can cause the same signs. Ariad cannot tell if you have a blood clot or what is causing your symptoms.
  applicability: { treatment_ids: [systemic-therapy], symptom_ids: [blood-clot-warning-symptoms] }
  source_ids: [ccs-chemotherapy-side-effects]
  claim_ids: [claim-blood-clot-warning-description-and-cause-boundary]

- <<: *blood_clot
  id: blood-clot-warning-home-management
  section: home_management
  title: What to do while getting help
  paragraphs:
    - Possible blood-clot signs need medical help. Do not wait to see if they go away.
  bullets:
    - Stop activity and keep your phone nearby.
    - Do not massage a new painful or swollen arm or leg.
    - Do not drive yourself if you have breathing, chest, back, fainting, or coughing-blood signs.
    - Have your medicine list and treatment information ready.
  priority_tags: [emergency-preparation]
  claim_ids: [claim-blood-clot-warning-immediate-steps]

- <<: *blood_clot
  id: blood-clot-warning-contact-team
  section: contact_team
  title: Contact your cancer team right away if…
  paragraphs:
    - Tell your team about new one-sided arm or leg pain, redness, warmth, or swelling. Do not wait for a reply before getting emergency help for the signs below.
  bullets:
    - Note where the change is, when it started, and whether it is spreading.
    - Tell them about any treatment line or recent time spent in bed, a chair, a car, or a plane.
  priority_tags: [contact-information, tracking, clot-signs, breathing-change, chest-change, bleeding]
  claim_ids: [claim-blood-clot-warning-contact-signs]

- <<: *blood_clot
  id: blood-clot-warning-urgent-attention
  section: urgent_attention
  title: Get urgent medical help now if…
  paragraphs:
    - The Canadian Cancer Society describes blood-clot symptoms as a medical emergency.
  bullets:
    - You have new pain, redness, or swelling in an arm or leg.
    - You have shortness of breath, chest or back pain, cough up blood, or faint. Call 911.
  priority_tags: [clot-signs, breathing-change, chest-change, bleeding]
  source_ids: [ccs-chemotherapy-side-effects]
  claim_ids: [claim-blood-clot-warning-emergency-signs]

- &eye_vision
  <<: *module_base
  id: eye-vision-about
  section: about
  title: About eye and vision changes
  paragraphs:
    - You may notice dry, watery, itchy, red, painful, or swollen eyes. Vision may become blurred, cloudy, doubled, dim, or different.
    - Treatment, medicines, infection, an eye problem, or another health problem may be involved. Ariad cannot tell what is causing it.
  applicability: { treatment_ids: [systemic-therapy], symptom_ids: [eye-vision-symptoms] }
  source_ids: [ccs-eye-vision-problems]
  claim_ids: [claim-eye-vision-description-and-cause-boundary]

- <<: *eye_vision
  id: eye-vision-home-management
  section: home_management
  title: General steps you can take at home
  paragraphs:
    - Protect your eyes while you wait to speak with your team.
  bullets:
    - Do not rub your eyes. Wash your hands before touching your eyelids.
    - Rest your eyes and use comfortable lighting. Wear sunglasses if light bothers you.
    - Do not drive if your vision is blurred, doubled, dim, or missing in any area.
    - Use eye drops only if your cancer team or eye-care professional says they are safe.
    - Record which eye is affected and when the change began.
  priority_tags: [vision-safety, tracking]
  claim_ids: [claim-eye-vision-home-steps]

- <<: *eye_vision
  id: eye-vision-contact-team
  section: contact_team
  title: Contact your cancer team if…
  paragraphs: []
  bullets:
    - You notice any new or changing eye or vision symptom during or after treatment.
    - You have eye pain, redness, swelling, discharge, light sensitivity, floaters, halos, or double vision.
    - Dry or watery eyes affect reading, walking, driving, sleep, or daily tasks.
  priority_tags: [contact-information, vision-safety, vision-change, eye-change]
  claim_ids: [claim-eye-vision-contact-signs]

- <<: *eye_vision
  id: eye-vision-urgent-attention
  section: urgent_attention
  title: Get urgent medical help if…
  paragraphs: []
  bullets:
    - You suddenly lose vision or cannot see from one eye. Call 911.
    - A vision change happens with face drooping, one-sided weakness or numbness, trouble speaking, or sudden loss of balance. Call 911.
    - You have a serious eye injury or strong eye pain that is getting worse.
  priority_tags: [vision-change]
  source_ids: [ccs-eye-vision-problems, canada-stroke-warning-signs]
  claim_ids: [claim-eye-vision-urgent-signs]

- &nail_hair
  <<: *module_base
  id: nail-hair-about
  section: about
  title: About nail and hair changes
  paragraphs:
    - Hair may thin, fall out, or change in texture. Nails may become dry, ridged, discoloured, tender, loose, or slow to grow.
    - Treatment, medicines, skin problems, or another health problem may be involved. Ariad cannot tell what is causing it.
  applicability: { treatment_ids: [systemic-therapy], symptom_ids: [nail-hair-changes] }
  source_ids: [ccs-skin-problems, bc-cancer-hair-loss-appearance]
