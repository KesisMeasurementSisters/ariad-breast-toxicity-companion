  paragraphs: []
  bullets:
    - You have any new shortness of breath, or your usual breathing becomes worse.
    - You have a new or changing cough, wheeze, chest tightness, or trouble with normal activity.
    - You also have swelling, a fast heartbeat, feel unwell, or cough up mucus or blood.
