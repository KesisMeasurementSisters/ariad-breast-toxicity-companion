- <<: *appetite_taste
  id: appetite-taste-home-management
  section: home_management
  title: General steps you can take at home
  paragraphs:
    - Choose foods and drinks that are easiest for you to manage.
  bullets:
    - Try small meals or snacks more often instead of large meals.
    - Add protein and energy with foods your team says are safe for you.
    - Try cool foods if cooking smells bother you. Use plastic cutlery if food tastes metallic.
    - Sip fluids between meals unless your team told you to limit them.
    - Keep your mouth clean and note which foods taste better or worse.
  priority_tags: [nutrition, hydration]
  claim_ids: [claim-appetite-taste-home-steps]

