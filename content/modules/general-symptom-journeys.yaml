  paragraphs: []
  bullets:
    - You cannot eat or drink enough, or you are losing weight without trying.
    - You feel weak or dizzy, pass very little urine, or have trouble swallowing.
    - Nausea, vomiting, pain, mouth sores, or taste changes keep you from eating.
  priority_tags: [contact-information, hydration, nutrition, food-fluids, mouth-care, nutrition-change]
  claim_ids: [claim-appetite-taste-contact-signs]

