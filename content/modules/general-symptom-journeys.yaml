  section: about
  title: About shortness of breath and cough
  paragraphs:
    - Shortness of breath can feel like you cannot get enough air. You may breathe faster, feel chest tightness, or need to stop during activity.
    - Cancer, treatment, infection, a clot, heart or lung problems, or another health problem may be involved. Ariad cannot tell what is causing it.
  applicability: { treatment_ids: [systemic-therapy], symptom_ids: [shortness-of-breath-cough] }
