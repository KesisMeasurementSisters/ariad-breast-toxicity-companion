- <<: *shortness_breath
  id: shortness-of-breath-cough-home-management
  section: home_management
  title: General steps you can take at home
  paragraphs:
    - Only manage shortness of breath at home if your cancer team has said it is safe for you to do so.
  bullets:
    - Stop and rest before you become very short of breath.
    - Sit upright or lean forward with your arms supported.
    - Relax your shoulders. Breathe in gently and breathe out slowly through pursed lips.
    - Use a fan or cool cloth on your face if it helps. Avoid smoke and strong scents.
    - Keep your phone nearby and ask for help with tasks.
  priority_tags: [breathing, daily-activities]
