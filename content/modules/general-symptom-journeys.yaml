- <<: *mouth
  id: mouth-soreness-home-management
  section: home_management
  title: General steps you can take at home
  paragraphs:
    - Follow the mouth-care plan from your cancer team.
  bullets:
    - Brush gently with a soft toothbrush. Keep your mouth and dentures clean.
    - Use only rinses your team says are safe. Avoid mouthwash with alcohol.
    - Sip fluids often unless your team told you to limit them.
    - Choose soft, moist foods. Avoid foods that are sharp, very hot, spicy, or acidic if they hurt.
    - Keep your lips moist with a plain lip balm.
  priority_tags: [oral-care, hydration]
  claim_ids: [claim-mouth-soreness-home-steps]

- <<: *mouth
  id: mouth-soreness-contact-team
  section: contact_team
  title: Contact your cancer team if…
  paragraphs: []
  bullets:
    - You have new sores, white patches, bleeding, swelling, or pain in your mouth or throat.
    - It is hard to eat, drink, swallow, speak, or wear dentures.
    - Your mouth feels very dry, or mouth care is not helping.
    - You feel unwell or have infection signs. Follow your team’s fever instructions.
  priority_tags: [contact-information, oral-care, mouth-care, food-fluids, swallowing]
  claim_ids: [claim-mouth-soreness-contact-signs]

- <<: *mouth
  id: mouth-soreness-urgent-attention
  section: urgent_attention
  title: Get urgent medical help if…
  paragraphs: []
  bullets:
    - You cannot swallow liquids or your own saliva.
    - You have heavy bleeding from your mouth, feel faint, or become confused.
    - You have trouble breathing or swelling of your face, lips, tongue, or throat. Call 911.
  priority_tags: [swallowing, food-fluids]
  source_ids: [cco-oral-care-patient-guide, canada-anaphylaxis-signs]
  claim_ids: [claim-mouth-soreness-urgent-signs]

- &rash
  <<: *module_base
  id: rash-itching-about
  section: about
  title: About rash and itching
  paragraphs:
    - A rash can look or feel different across skin tones. You may notice colour change, bumps, dry skin, itching, pain, or warmth.
    - Treatment, medicines, skin products, infection, allergy, or another health problem may be involved. Ariad cannot tell what is causing it.
  applicability: { treatment_ids: [systemic-therapy], symptom_ids: [rash-itching] }
  source_ids: [ccs-skin-problems]
  claim_ids: [claim-rash-itching-description-and-cause-boundary]

- <<: *rash
  id: rash-itching-home-management
  section: home_management
  title: General steps you can take at home
  paragraphs:
    - Treat your skin gently. Do not start a medicated cream unless your cancer team says it is safe.
  bullets:
    - Use lukewarm water and a mild, scent-free cleanser.
    - Pat your skin dry. Apply a plain, scent-free moisturizer.
    - Wear loose, soft clothing. Keep your nails short and try not to scratch.
    - Protect your skin from the sun. Note any new soap, cream, medicine, or food.
  priority_tags: [skin-care, tracking]
  claim_ids: [claim-rash-itching-home-steps]

- <<: *rash
  id: rash-itching-contact-team
  section: contact_team
  title: Contact your cancer team if…
  paragraphs: []
  bullets:
    - A rash is new, spreading, painful, warm, blistering, peeling, or keeping you awake.
    - You have open skin, drainage, swelling, or feel unwell.
    - The rash started after a new medicine or during the days after an infusion.
  priority_tags: [contact-information, skin-care, skin-change, allergy-signs, breathing-change]
  claim_ids: [claim-rash-itching-contact-signs]

- <<: *rash
  id: rash-itching-urgent-attention
  section: urgent_attention
  title: Get urgent medical help if…
  paragraphs: []
  bullets:
    - A rash or hives happens with swelling of your face, lips, tongue, or throat.
    - You have trouble breathing, chest tightness, fainting, or sudden severe dizziness. Call 911.
    - Your skin is quickly blistering or peeling and you feel very unwell.
  priority_tags: [skin-change, allergy-signs, breathing-change]
  source_ids: [ccs-skin-problems, canada-anaphylaxis-signs]
  claim_ids: [claim-rash-itching-urgent-signs]

- &hand_foot
  <<: *module_base
  id: hand-foot-about
  section: about
  title: About hand and foot symptoms
  paragraphs:
    - Your palms or soles may become red or darker, swollen, tender, numb, dry, cracked, blistered, or peeling.
    - Treatment, pressure, heat, skin problems, or another health problem may be involved. Ariad cannot tell what is causing it.
  applicability: { treatment_ids: [systemic-therapy], symptom_ids: [hand-foot-symptoms] }
  source_ids: [cco-hand-foot-syndrome-patient-guide]
  claim_ids: [claim-hand-foot-description-and-cause-boundary]

- <<: *hand_foot
  id: hand-foot-home-management
  section: home_management
  title: General steps you can take at home
  paragraphs:
    - Protect your hands and feet from heat, rubbing, and pressure.
  bullets:
    - Use cool or lukewarm water. Pat the skin dry.
    - Apply a plain moisturizer your team says is safe. Do not rub it in hard.
    - Wear loose shoes, soft socks, and gloves for house or yard work.
    - Avoid long walks, running, hot tubs, and tight tools if they make symptoms worse.
    - Check your hands and feet each day for cracks, blisters, or open skin.
  priority_tags: [skin-care, hand-safety, foot-safety]
  claim_ids: [claim-hand-foot-home-steps]

- <<: *hand_foot
  id: hand-foot-contact-team
  section: contact_team
  title: Contact your cancer team if…
  paragraphs: []
  bullets:
    - You have new or worsening pain, redness or darkening, swelling, cracks, blisters, or peeling.
    - It is hard to walk, hold objects, get dressed, or do daily tasks.
    - Skin is open, draining, warm, or very tender.
  priority_tags: [contact-information, skin-care, skin-change, pain, daily-activities]
  claim_ids: [claim-hand-foot-contact-signs]

- <<: *hand_foot
  id: hand-foot-urgent-attention
  section: urgent_attention
  title: Get urgent medical help if…
  paragraphs: []
  bullets:
    - Redness or swelling spreads quickly and you suddenly feel very unwell.
    - Pain or weakness makes it unsafe to stand or walk and you cannot reach your cancer team.
    - You also have trouble breathing, chest pain, fainting, or sudden confusion. Call 911.
  priority_tags: [skin-change, pain, daily-activities]
  source_ids: [cco-hand-foot-syndrome-patient-guide, heart-stroke-emergency-signs]
  claim_ids: [claim-hand-foot-urgent-signs]

