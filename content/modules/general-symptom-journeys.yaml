  id: vomiting-home-management
  section: home_management
  title: General steps you can take at home
  paragraphs:
    - Use anti-nausea medicine only as your cancer team told you.
  bullets:
    - After vomiting, wait a short time, then try small sips of clear fluid if your team has not limited fluids.
    - When fluids stay down, try small amounts of plain food.
    - Sit upright and rinse your mouth gently after vomiting.
    - Record how often you vomit and how much you can drink.
