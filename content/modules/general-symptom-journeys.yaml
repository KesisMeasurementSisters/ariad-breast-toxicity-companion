  <<: *module_base
  id: appetite-taste-about
  section: about
  title: About appetite and taste changes
  paragraphs:
    - You may feel less hungry, get full quickly, or notice that food tastes or smells different.
    - Treatment, nausea, mouth changes, mood, or another health problem may be involved. Ariad cannot tell what is causing it.
